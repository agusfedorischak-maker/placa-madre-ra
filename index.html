<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Placa Madre - AR</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <!-- Usamos un marcador genérico de patrón que levanta al toque en pantalla -->
      <a-marker preset="hiro">
        <a-box position="0 0.5 0" material="color: #ff0000; opacity: 0.8;" scale="0.6 0.6 0.6" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
        <a-text value="PLACA MADRE" position="0 1.2 0" align="center" color="#FFFFFF" scale="1.5 1.5 1.5"></a-text>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
