<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Cargamos las librerías gratuitas de A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Marcador genérico 'hiro' (reconoce el patrón predeterminado) -->
      <a-marker preset="hiro">
        <!-- Objeto 3D o Texto que flota encima de la placa -->
        <a-text value="PLACA MADRE" position="0 1.2 0" align="center" color="#00FFFF" scale="1.5 1.5 1.5"></a-text>
        <a-box position="0 0.5 0" material="color: cyan; opacity: 0.7;" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-box>
      </a-marker>

      <!-- Cámara del teléfono -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
