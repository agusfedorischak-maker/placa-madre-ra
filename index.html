<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realidad Aumentada - Placa Madre</title>
    <!-- Librerías gratuitas de MindAR -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Objeto 3D y texto flotando sobre la imagen de la placa -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Texto flotante -->
        <a-text 
          value="PLACA MADRE" 
          position="0 0.8 0" 
          align="center" 
          color="#00FFFF" 
          scale="1.2 1.2 1.2">
        </a-text>
        
        <!-- Cubo de neón 3D flotante e interactivo -->
        <a-box 
          position="0 0.2 0.2" 
          scale="0.4 0.4 0.4"
          material="color: cyan; opacity: 0.8; transparent: true;" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
        </a-box>
      </a-entity>
    </a-scene>
  </body>
</html>
